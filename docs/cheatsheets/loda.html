<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>L-O-D-A auction board</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
  .you-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px 14px; margin: 6px 0 14px; }
  .you-grid div { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; }
  .you-grid .k { display: block; font: 600 10.5px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
  .you-grid b { font-size: 17px; }
  .hard { color: var(--warn); }
  .mr { color: var(--accent); font-size: 12px; }
  .ro { font: 600 10px var(--mono); color: var(--warn); background: var(--warn-soft); border-radius: 3px; padding: 1px 5px; margin-left: 4px; vertical-align: middle; }
  .scen { border-collapse: collapse; font-size: 13px; margin-top: 4px; }
  .scen th, .scen td { padding: 4px 12px 4px 0; text-align: left; border-bottom: 1px solid var(--line); }
  .scen th { font: 600 10.5px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
  .scen.grid td, .scen.grid th { text-align: center; padding: 5px 12px; }
  .scen.grid th:first-child { text-align: left; }
  .scen.grid td.no { color: var(--warn); font: 600 11px var(--mono); background: var(--warn-soft); }
  .tier li { grid-template-columns: 46px 1fr 44px 44px; }
  .tier-wide { grid-column: 1 / -1; }
  .tier-wide ol { column-count: 3; column-gap: 0; }
  .tier-wide li { break-inside: avoid; }
  .sugg { font: 700 13px var(--mono); color: var(--accent); text-align: right; }
  .sugg.dim { color: var(--ink-3); font-weight: 500; }
  .hardc { font: 600 11px var(--mono); color: var(--warn); text-align: right; }
</style>
</head>
<body>
<header class="site"><div class="wrap board-wrap">
  <div class="brand"><a href="../index.html">fantasy<span class="dot">.</span>sports</a></div>
  <nav class="site">
    <a href="../index.html">Home</a><a href="index.html">Cheat sheet</a>
      <a href="redraft.html">Redraft</a><a href="guillotine.html">Guillotine</a>
    <a href="loda.html" aria-current="page">L-O-D-A</a><a href="foxwoods.html">Foxwoods</a><a href="../methodology.html">Method</a>
  </nav>
</div></header>
<main><div class="wrap board-wrap">
  <div id="banner" style="margin-top:14px"></div>
  <section class="myteam"><div id="you"></div><div id="scenarios"></div></section>
  <div class="board-bar">
    <div class="tabs" id="tabs" role="tablist"></div><span class="spacer"></span>
    <input type="search" id="search" placeholder="Filter players…" aria-label="Filter players">
    <button class="btn-sm" id="reset">Reset sold</button>
  </div>
  <div class="meta" id="meta"></div>
  <div class="tiers" id="tiers"></div>
</div></main>

<script src="../assets/loda.js"></script>
</body></html>
