<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>__TITLE__</title>
<style>
  @page { size: __PAGESIZE__; margin: 0.35in 0.3in 0.4in; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font: 8.4pt/1.28 -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif;
    color: #111; -webkit-print-color-adjust: exact; print-color-adjust: exact;
  }
  .sheet { break-after: page; }
  .sheet:last-child { break-after: auto; }

  header.pg {
    display: flex; align-items: baseline; gap: 10px;
    border-bottom: 1.6pt solid #111; padding-bottom: 3pt; margin-bottom: 6pt;
  }
  header.pg h1 { font-size: 15pt; margin: 0; letter-spacing: -0.3pt; }
  header.pg .sub { font-size: 7.6pt; color: #555; margin-left: auto; text-align: right; line-height: 1.35; }
  header.pg .count { font-size: 8.5pt; color: #666; font-weight: 600; }

  .cols { column-count: 3; column-gap: 10pt; }
  .tier { break-inside: avoid; margin: 0 0 5pt; border-left: 3pt solid var(--tc); }
  .tier > .th {
    font: 700 7.4pt/1.5 ui-monospace, Menlo, monospace; letter-spacing: 0.5pt;
    padding: 1.5pt 5pt; background: var(--tb); color: #222;
    display: flex; justify-content: space-between;
  }
  .tier > .th .n { font-weight: 400; color: #666; }
  table { width: 100%; border-collapse: collapse; }
  td { padding: 1.4pt 3pt; vertical-align: baseline; border-bottom: 0.4pt solid #e6e2db; }
  tr:last-child td { border-bottom: 0; }
  .box { width: 7.5pt; }
  .box i { display: inline-block; width: 6pt; height: 6pt; border: 0.6pt solid #999; border-radius: 1pt; }
  .rk { font: 600 7pt ui-monospace, Menlo, monospace; color: #777; width: 20pt; }
  .nm { font-weight: 600; }
  .tm { font: 6.6pt ui-monospace, Menlo, monospace; color: #888; letter-spacing: 0.2pt; }
  .by { width: 15pt; text-align: center; font: 700 7pt ui-monospace, Menlo, monospace; border-radius: 2pt; }
  .by.e { background: #f8e3c8; color: #7a4a05; }
  .by.m { background: #eeeae3; color: #555; }
  .by.l { background: #d6ecdd; color: #14532d; }
  .sr { width: 26pt; text-align: right; font: 6.6pt ui-monospace, Menlo, monospace; color: #999; }
  .mv { width: 20pt; text-align: right; font: 700 6.6pt ui-monospace, Menlo, monospace; }
  .mv.u { color: #16794c; } .mv.d { color: #a3560b; } .mv.z { color: #bbb; }

  .legend {
    margin-top: 7pt; padding-top: 4pt; border-top: 0.6pt solid #ccc;
    font-size: 6.9pt; color: #555; line-height: 1.45; column-span: all;
  }
  .legend b { color: #111; }

  /* strategy / bye reference page */
  .ref h2 { font-size: 10.5pt; margin: 9pt 0 3pt; }
  .ref p, .ref li { font-size: 8.2pt; color: #333; margin: 2pt 0; line-height: 1.42; }
  .ref .two { column-count: 2; column-gap: 16pt; }
  .byetab { width: 100%; border-collapse: collapse; margin-top: 4pt; }
  .byetab th, .byetab td { border: 0.5pt solid #ccc; padding: 2.5pt 4pt; font-size: 7.6pt; text-align: left; }
  .byetab th { background: #f0ede8; font-size: 7pt; letter-spacing: 0.3pt; }
  .byetab td.wk { font: 700 8pt ui-monospace, Menlo, monospace; width: 34pt; text-align: center; }
  .grid18 { display: grid; grid-template-columns: repeat(6, 1fr); gap: 3pt; margin-top: 4pt; }
  .grid18 div { border: 0.5pt solid #ccc; padding: 3pt; font-size: 7.4pt; }
  .grid18 b { font: 700 8pt ui-monospace, Menlo, monospace; }
</style></head>
<body>__BODY__</body></html>
