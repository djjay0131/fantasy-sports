name: ci
on: [push, pull_request]

jobs:
  governance-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the diff-based checks compare against the base ref

      - name: Checkout canonical governance
        uses: actions/checkout@v4
        with:
          repository: djjay0131/agentic-governance
          path: .agentic-governance

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run governance convention checks
        # --layout enforces the two-plane rule and the paths declared in
        # llm/governance/governance-delta.md §Repository Layout on every
        # run, not only at onboarding. The script runs against the repo
        # containing the cwd, not the one holding the script.
        run: node .agentic-governance/plugin/scripts/governance-checks.mjs --layout

  licensed-data-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assert no licensed source data is tracked
        # ADR-0001: data/ and docs/data/*.json are git-ignored. Only the
        # sample datasets and the README may be tracked under docs/data/.
        # A `git add -f` is the only way to defeat .gitignore, and this
        # job is what catches it.
        run: |
          set -euo pipefail
          bad=$(git ls-files 'data/**' 'data' || true)
          if [ -n "$bad" ]; then
            echo "::error::Tracked files under data/ — see llm/governance/adr/0001-public-tooling-private-source-data.md"
            echo "$bad"
            exit 1
          fi
          bad=$(git ls-files 'docs/data/*' \
                | grep -v -E '^docs/data/(rankings\.sample\.json|guillotine\.sample\.json|README\.md)$' || true)
          if [ -n "$bad" ]; then
            echo "::error::Unexpected tracked file under docs/data/ — only the *.sample.json files and README.md are permitted (ADR-0001)"
            echo "$bad"
            exit 1
          fi
          echo "OK — no licensed source data tracked."

      - name: Assert .gitignore still covers the private paths
        run: |
          set -euo pipefail
          for p in data/raw/probe.html data/processed/probe.json docs/data/rankings.json; do
            if ! git check-ignore -q "$p"; then
              echo "::error::.gitignore no longer ignores $p (ADR-0001)"
              exit 1
            fi
          done
          echo "OK — .gitignore covers the private paths."

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Unit tests
        run: node --test tests/*.test.mjs

      - name: Sample board is reproducible
        # The committed sample must be exactly what scripts/make-sample.mjs
        # produces, so a hand-edited dataset cannot drift in unnoticed.
        run: |
          set -euo pipefail
          for f in rankings guillotine; do
            test -f "docs/data/$f.sample.json"
            cp "docs/data/$f.sample.json" "/tmp/committed-$f.json"
          done
          node scripts/make-sample.mjs
          python3 - <<'PY'
          import json
          for f in ('rankings', 'guillotine'):
              a = json.load(open(f'/tmp/committed-{f}.json'))
              b = json.load(open(f'docs/data/{f}.sample.json'))
              for k in ('generated_at',):
                  a.pop(k, None); b.pop(k, None)
              a.get('derived_from', {}).pop('generated_at', None)
              b.get('derived_from', {}).pop('generated_at', None)
              assert a == b, f'docs/data/{f}.sample.json is not what scripts/make-sample.mjs produces'
              print(f'OK - {f}.sample.json is reproducible.')
          PY
